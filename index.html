<!doctype html>
<!-- The engine theme and the CSS token layer are separate switches: the
     provider picks the engine's dark row, this class is what makes the custom
     properties resolve to their dark values. Setting one without the other
     gives a dark page with light hairlines. -->
<html lang="en" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- The tenant's name is added by main.tsx, because which tenant this is
         depends on the host and this file is the same on all of them. Naming
         one here would put "Lux Vote" in the tab of hanzo.vote for as long as
         the bundle took to parse. -->
    <!-- The estate's mark, served from the one place it lives. The triangle is
         what survives sixteen pixels of tab, and it carries the brand's own
         prefers-color-scheme rule — right in browser chrome, which follows the
         desktop rather than this app's own setting. The raster beside it is for
         Safari, which takes no SVG on a home screen and falls back to a
         screenshot of the page when it cannot read the file it was given. -->
    <link rel="icon" href="https://cdn.lux.cloud/brand/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="https://cdn.lux.cloud/brand/icon-180.png" />
    <title>Vote</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
