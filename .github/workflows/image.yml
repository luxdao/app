name: Image

# What lux.vote runs is built here, from this repository.
#
# It used to be built from luxfi/dao, whose `app` submodule held an interface
# derived from Decent DAO. That app is replaced; this one is the source.
#
# The tag shape is `lux-<short sha>` because that is what
# luxfi/universe deploy/lux-vote/lux-vote.yaml pins. A declaration reads a tag;
# it does not follow a branch. Publishing to a repository no declaration reads
# is how every commit between 2026-07-18 and 25feb87 built an image nothing
# pulled — CI green, registry populated, cluster unchanged.

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: [self-hosted, linux, amd64]
    strategy:
      fail-fast: false
      # One app, every brand — the same bundle built once per DAO with a
      # different home, rather than a fork per DAO that drifts. A brand added
      # here needs a venue of the same key in src/gov/chain.ts; the build
      # refuses an unknown one.
      matrix:
        include:
          - brand: lux
            home: lux
            site: https://lux.vote
          - brand: zoo
            home: zoo
            site: https://zoo.vote
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container
          driver-opts: |
            network=host

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GH_TOKEN != '' && secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/luxfi/vote
          # No floating tag. A cluster pins a version; `latest` on a registry is
          # a moving target that makes "what is deployed" unanswerable.
          flavor: |
            latest=false
          tags: |
            type=sha,format=short,prefix=${{ matrix.brand }}-

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            VITE_VOTE_HOME=${{ matrix.home }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Say what to pin
        run: |
          echo "Built ${{ matrix.brand }} (${{ matrix.site }}): ${{ steps.meta.outputs.tags }}"
          echo "Pin it in luxfi/universe deploy/lux-vote/lux-vote.yaml under image.tag."
          echo "Nothing deploys until that file names this tag."
